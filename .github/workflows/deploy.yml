name: Deploy to VNPT Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Cho phép trigger thủ công từ giao diện GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/nguyenanhduchl/cabinet-backend:latest

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Sync files to server via rsync
        run: |
          export SSHPASS="${{ secrets.VNPT_PASS }}"
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'node_modules' \
            --exclude 'bin' \
            --exclude 'obj' \
            --exclude 'data_dump' \
            ./ ${{ secrets.VNPT_USER }}@${{ secrets.VNPT_HOST }}:/opt/cabinet/

      - name: Restart Docker containers on server
        run: |
          export SSHPASS="${{ secrets.VNPT_PASS }}"
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VNPT_USER }}@${{ secrets.VNPT_HOST }} << 'EOF'
            cd /opt/cabinet
            
            # Đăng nhập vào GHCR trên server để pull image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Xóa container clamav cũ nếu có lỗi xung đột tên
            docker rm -f doc-clamav || true
            
            # Pull image mới nhất từ GHCR
            docker-compose pull cabinet-backend
            
            # Khởi động lại (Bỏ --build để không build trên server)
            docker-compose down
            docker-compose --compatibility up -d
          EOF
