version: '3.3'

services:
  cabinet-backend:
    image: ghcr.io/nguyenanhduchl/cabinet-backend:latest
    container_name: cabinet-system
    expose:
      - "5000"
    ports:
      - "59609:5000"
    # ✅ Tầng 5: Chạy container với quyền tối thiểu — chống leo thang quyền (ransomware)
    security_opt:
      - no-new-privileges:true
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DB_PATH=/app/data/documents.db
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/documents.db
      - TZ=Asia/Ho_Chi_Minh
      - JWT_SECRET=${JWT_SECRET}
      - PUBLIC_ID_SECRET=${PUBLIC_ID_SECRET}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # --- ClamAV Config ---
      - ClamAv__Host=clamav
      - ClamAv__Port=3310
      # --- OCR Performance Tuning ---
      - OcrSettings__RenderDpi=300
      - OcrSettings__MaxParallelPages=2
      - OcrSettings__MaxPagesToScan=7
      - OcrSettings__EnableOsd=false
      - OcrSettings__EnableDeskew=true
    depends_on:
      - clamav
    volumes:
      - ./data_dump:/app/data
      - ./Cabinet.Api/Uploads:/app/Uploads
      - ./Cabinet.Core/Models/PaddleOCR:/app/Models/PaddleOCR:ro
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



  # ✅ Tầng 1: ClamAV Anti-Virus Scanner
  # Container riêng biệt, cô lập hoàn toàn với backend
  clamav:
    image: clamav/clamav:latest
    container_name: doc-clamav
    environment:
      - CLAMAV_NO_FRESHCLAMD=false  # Cập nhật database virus tự động
      - CLAMD_CONF_MaxFileSize=100M
      - CLAMD_CONF_StreamMaxLength=100M
    volumes:
      - clamav-db:/var/lib/clamav  # Database virus được persist giữa các lần khởi động
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: cabinet-nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - cabinet-backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"



volumes:
  clamav-db:  # Named volume — ClamAV virus database tồn tại giữa các lần restart
